name: Publish
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore huoreimu.csproj

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.5.1
          use-dotnet: true
          include-templates: true

      - name: Get Godot executable path
        id: godot-path
        run: echo "GODOT_EXE=$(which godot)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Import Godot project
        run: godot --headless --editor --quit --path . --import
        shell: bash

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Verify Huoreimu.json version matches tag
        run: |
          JSON_VERSION=$(jq -r '.version' Huoreimu.json)
          if [ "$JSON_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Huoreimu.json version ($JSON_VERSION) does not match tag version (${{ steps.version.outputs.version }})."
            echo "::error::Use scripts/release.sh (or .bat/.ps1) to create the tag - it will update Huoreimu.json automatically."
            exit 1
          fi
          echo "Huoreimu.json version ($JSON_VERSION) matches tag."
        shell: bash

      # actions/checkout 会把 refs/tags/<tag> 强制指向 commit（轻量标签），导致取不到附注标签的说明文字。
      # 这里先把附注标签对象取回来，并写出一份说明文件（供创意工坊 changenote 与 GitHub Release 正文使用）。
      - name: Extract tag note
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" \
            || echo "::warning::failed to restore annotated tag, falling back to default note"
          TAG_TYPE=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(objecttype)')
          echo "tag object type: $TAG_TYPE"
          if [ "$TAG_TYPE" = "tag" ]; then
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > /tmp/release_note.txt
          fi
          if [ ! -s /tmp/release_note.txt ]; then
            echo "Release v${{ steps.version.outputs.version }}" > /tmp/release_note.txt
          fi
          echo "----- release note -----"
          cat /tmp/release_note.txt
        shell: bash

      - name: Check workshop version
        id: check-workshop
        run: |
          VERSION_MARKER="workshop_v:${{ steps.version.outputs.version }}"
          RESPONSE=$(curl -sS -X POST "https://api.steampowered.com/ISteamRemoteStorage/GetPublishedFileDetails/v1/" \
            -d "itemcount=1" -d "publishedfileids%5B0%5D=3747596598" 2>/dev/null) || true
          DESCRIPTION=$(echo "$RESPONSE" | jq -r '.response.publishedfiledetails[0].description // empty')
          if echo "$DESCRIPTION" | grep -qF "$VERSION_MARKER"; then
            echo "Workshop already has version ${{ steps.version.outputs.version }}, skipping upload."
            echo "skip-workshop=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip-workshop=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build and export .pck
        run: |
          if [[ "${{ github.ref_name }}" == *b ]]; then
            BRANCH="beta_version"
          else
            BRANCH="master"
          fi
          dotnet publish huoreimu.csproj -c Release -p:CurrentBranch="$BRANCH"
        env:
          GodotPath: ${{ steps.godot-path.outputs.GODOT_EXE }}
          ModsPath: ${{ github.workspace }}/mods_output/
        shell: bash

      - name: Install steamcmd
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 libstdc++6:i386
          mkdir -p "$HOME/steamcmd"
          curl -sSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C "$HOME/steamcmd/"
          chmod +x "$HOME/steamcmd/steamcmd.sh"
          find "$HOME/steamcmd/linux32" -type f -exec chmod +x {} +
        shell: bash

      - name: Setup Steam config
        run: |
          mkdir -p "$HOME/.steam/steam/config"
          echo "$STEAM_CONFIG_VDF" > "$HOME/.steam/steam/config/config.vdf"
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        shell: bash

      - name: Generate Steam manifest
        if: steps.check-workshop.outputs.skip-workshop != 'true'
        run: |
          case "$(jq -r '.visibility' workshop.json)" in
            public)  VISIBILITY=0 ;;
            friends) VISIBILITY=1 ;;
            private) VISIBILITY=2 ;;
            unlisted) VISIBILITY=3 ;;
            *)       VISIBILITY=0 ;;
          esac
          VERSION="${{ steps.version.outputs.version }}"
          TAGS=$(jq -r '.tags | join(",")' workshop.json)
          TITLE=$(jq -r '.title' workshop.json)
          CONTENTDIR="${{ github.workspace }}/mods_output/huoreimu"
          PREVIEWFILE="${{ github.workspace }}/Huoreimu/mod_image.png"
          # changenote 会内联进 VDF 的引号里：只取首行并去掉双引号
          CHANGENOTE=$(head -n1 /tmp/release_note.txt 2>/dev/null | tr -d '"')
          if [ -z "$CHANGENOTE" ]; then
            CHANGENOTE="Release v${VERSION}"
          fi
          echo "changenote: $CHANGENOTE"
          {
            cat descriptions/english.bbcode
            echo ""
            echo "workshop_v:${VERSION}"
          } > /tmp/manifest_desc.txt
          echo '"workshopitem"' > manifest.vdf
          echo '{' >> manifest.vdf
          echo '    "appid" "2868840"' >> manifest.vdf
          echo '    "publishedfileid" "3747596598"' >> manifest.vdf
          echo '    "title" "'"$TITLE"'"' >> manifest.vdf
          printf '    "description" "' >> manifest.vdf
          cat /tmp/manifest_desc.txt >> manifest.vdf
          printf '"\n' >> manifest.vdf
          echo '    "contentfolder" "'"$CONTENTDIR"'"' >> manifest.vdf
          echo '    "previewfile" "'"$PREVIEWFILE"'"' >> manifest.vdf
          echo '    "visibility" "'"$VISIBILITY"'"' >> manifest.vdf
          echo '    "changenote" "'"$CHANGENOTE"'"' >> manifest.vdf
          echo '    "tags" "'"$TAGS"'"' >> manifest.vdf
          echo '}' >> manifest.vdf
        shell: bash

      - name: Upload to Steam Workshop
        if: steps.check-workshop.outputs.skip-workshop != 'true'
        run: |
          if ! "$HOME/steamcmd/steamcmd.sh" +login "$STEAM_USERNAME" +workshop_build_item "$(pwd)/manifest.vdf" +quit; then
            echo "::error::Steam upload failed"
            ls -Ralph "$HOME/.steam/steam/logs/" 2>/dev/null || true
            cat "$HOME/.steam/steam/logs/stderr.txt" 2>/dev/null || true
            exit 1
          fi
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        shell: bash

      - name: Package Release Artifacts
        run: |
          cd mods_output/huoreimu
          zip -r "$GITHUB_WORKSPACE/huoreimu-v${{ steps.version.outputs.version }}.zip" .
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            huoreimu-v${{ steps.version.outputs.version }}.zip
          body_path: /tmp/release_note.txt
          generate_release_notes: true
